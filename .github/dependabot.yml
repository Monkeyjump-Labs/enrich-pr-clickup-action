version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Give a new release a week to be yanked before it is proposed here
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Give a new release a week to be yanked before it is proposed here
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: 'development'
