name: Smoke test

# Kept out of ci.yml: the release workflow calls ci.yml, and a called workflow may not hold a job
# asking for more permissions than the caller grants, even one that would be skipped.
on:
  pull_request:

permissions: {}

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the action itself, from this checkout, against the PR it is testing. It proves the
  # composite wiring works end to end: github-script loads the code, the PR is read, and ClickUp is
  # called for any ticket the PR names. Without a CLICKUP_API_TOKEN secret every lookup fails, which
  # the action reports as a warning, and the run still passes.
  smoke:
    name: Smoke test the action
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the action
        uses: ./
        with:
          pr_number: ${{ github.event.pull_request.number }}
          clickup_api_token: ${{ secrets.CLICKUP_API_TOKEN || 'not-configured' }}
          clickup_team_id: ${{ vars.CLICKUP_TEAM_ID }}
          fail_on_no_ticket: 'false'
          post_ticket_comments: 'false'
