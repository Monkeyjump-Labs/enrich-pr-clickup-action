name: Enrich PR with ClickUp Information
description: 'Extracts ClickUp ticket IDs from a PR, fetches labels from ClickUp, and applies them to the PR.'

inputs:
  clickup_api_token:
    description: The clickup API token that has access to retrieve ticket information
    required: true
  clickup_team_id:
    description: 'The ClickUp team/workspace ID (required for custom task IDs like ENG-123). Find it in your ClickUp URL.'
    required: false
  github_token:
    description: 'GITHUB_TOKEN or a repo scoped PAT'
    default: ${{ github.token }}
    required: false
  pr_number:
    description: 'The number of the pull request to apply labels to'
    required: true
  fail_on_no_ticket:
    description: 'Whether to fail the action if no ClickUp ticket is found in the PR'
    default: 'true'
    required: false
  post_ticket_comments:
    description: 'Whether to post a PR comment per linked ClickUp ticket summarizing it, so reviewers (human and AI) can see the ticket without leaving the PR. Comments are keyed by ticket and updated in place, never duplicated.'
    default: 'true'
    required: false
  comment_description_limit:
    description: 'Maximum number of ticket description characters to include in a ticket comment before truncating'
    default: '4000'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Enrich PR with ClickUp tickets
      id: enrich
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        CLICKUP_API_TOKEN: ${{ inputs.clickup_api_token }}
        CLICKUP_TEAM_ID: ${{ inputs.clickup_team_id }}
        PR_NUMBER: ${{ inputs.pr_number }}
        FAIL_ON_NO_TICKET: ${{ inputs.fail_on_no_ticket }}
        POST_TICKET_COMMENTS: ${{ inputs.post_ticket_comments }}
        COMMENT_DESCRIPTION_LIMIT: ${{ inputs.comment_description_limit }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const path = require('path');
          const { readInputs, run } = require(path.join(process.env.ACTION_PATH, 'src', 'enrich-pr.js'));
          await run({ github, context, core, inputs: readInputs(process.env) });
